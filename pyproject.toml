[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius-cli"
version = "0.4.1"
description = "Repo dependency analyzer with blast-radius impact scoring for AI-assisted development"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "anyio>=4.9,<5",
    "jsonschema>=4.20,<5",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
    "json5>=0.12,<0.13",
    "tomli ; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/IWasZ3r0Cool/blast-radius"
Repository = "https://github.com/IWasZ3r0Cool/blast-radius"
Issues = "https://github.com/IWasZ3r0Cool/blast-radius/issues"

[project.scripts]
blastradius = "blastradius.cli:main"

[project.optional-dependencies]
watch    = ["watchdog"]
yaml     = ["PyYAML"]
toml     = ["tomli ; python_version < '3.11'"]
dev      = ["pytest>=7"]
semantic = ["sqlite-vec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["blastradius*"]

[tool.setuptools.package-data]
"blastradius" = ["py.typed", "static/*.html"]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
